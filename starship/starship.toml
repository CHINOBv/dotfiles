# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         Starship Prompt Config                            ║
# ║                      Catppuccin Mocha Theme                               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# Timeout for commands (ms)
command_timeout = 1000

# Add newline at the start
add_newline = true

# Format (what modules to show and in what order)
format = """
[╭─](surface1)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$all\
$time\
$line_break\
[╰─](surface1)\
$character"""

# Right side prompt
right_format = """$cmd_duration"""

# Palette
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ═══════════════════════════════════════════════════════════════════════════════
# MODULES
# ═══════════════════════════════════════════════════════════════════════════════

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
Fedora = ""
Ubuntu = ""
Debian = ""
Arch = ""
Manjaro = ""
Windows = ""
Macos = ""
Linux = ""

[username]
show_always = false
style_user = "bold teal"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold pink"
format = "[@$hostname]($style) "

[directory]
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold yellow"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"Projects" = " "
"dotfiles" = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "bold overlay0"
format = "[$time]($style)"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ═══════════════════════════════════════════════════════════════════════════════
# LANGUAGE MODULES
# ═══════════════════════════════════════════════════════════════════════════════

[c]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = "󰪮 "
style = "bold mauve"
format = "[$symbol($version )(🎯 $tfm )]($style)"
heuristic = true

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

[kotlin]
symbol = " "
style = "bold mauve"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold peach"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "bold peach"
format = "[$symbol($version )]($style)"

[dart]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"

# Flutter detection is handled by dart module
# [flutter] - removed, not supported in this starship version

[terraform]
symbol = "󱁢 "
style = "bold mauve"
format = "[$symbol$workspace]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold blue"
format = '[$symbol$context( \($namespace\))]($style) '

[aws]
symbol = " "
style = "bold peach"
format = '[$symbol($profile )(\($region\) )]($style)'

[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = "[$symbol($subscription)]($style) "

[gcloud]
disabled = false
symbol = " "
style = "bold blue"
format = '[$symbol$account(@$domain)(\($project\))]($style) '

# ═══════════════════════════════════════════════════════════════════════════════
# OTHER MODULES
# ═══════════════════════════════════════════════════════════════════════════════

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
style = "bold red"

[memory_usage]
disabled = true
symbol = "󰍛 "
threshold = 75
style = "bold red"
format = "$symbol[${ram_pct}]($style) "

[jobs]
symbol = "✦ "
style = "bold blue"
number_threshold = 1
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘"
style = "bold red"
format = "[$symbol $status]($style) "
